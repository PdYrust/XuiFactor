name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: make fmt

      - name: Verify formatted tree
        run: git diff --exit-code -- cmd internal

      - name: Test
        run: make test

      - name: Build
        run: make build

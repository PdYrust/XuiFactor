name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xui
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: xui_factor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_DSN: postgres://xui:secret@127.0.0.1:5432/xui_factor_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: make fmt

      - name: Verify formatted tree
        run: git diff --exit-code -- cmd internal

      - name: Test
        run: make test

      - name: Build
        run: make build
